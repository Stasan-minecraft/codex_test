name: Build AutoCraft Fabric 1.16.5

on:
  push:
    branches:
      - autocraft-fabric-1.16.5
  pull_request:
    branches:
      - autocraft-fabric-1.16.5
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Collect release JAR
        if: success()
        run: |
          mkdir -p release
          cp build/libs/AutoCraft-Fabric-1.16.5-1.2.0.jar release/AutoCraft-Fabric-1.16.5-v1.2.jar
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AutoCraft-Fabric-1.16.5-v1.2
          path: release/AutoCraft-Fabric-1.16.5-v1.2.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoCraft-build-log
          path: build.log
          if-no-files-found: warn
      - name: Post failure details
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### AutoCraft build failed'
            echo
            echo '```text'
            tail -n 120 build.log
            echo '```'
          } > failure-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file failure-comment.md
