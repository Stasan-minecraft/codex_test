name: Build AutoCraft Fabric 1.16.5

on:
  push:
    branches:
      - autocraft-fabric-1.16.5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build mod
        run: gradle build --stacktrace --no-daemon
      - name: Collect release JAR
        run: |
          mkdir -p release
          cp build/libs/AutoCraft-Fabric-1.16.5-1.0.0.jar release/AutoCraft-Fabric-1.16.5.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCraft-Fabric-1.16.5
          path: release/AutoCraft-Fabric-1.16.5.jar
          if-no-files-found: error
