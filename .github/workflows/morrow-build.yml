name: Build MORROW JAR

on:
  push:
    branches:
      - chatgpt-morrow-build-20260814
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct MORROW source
        shell: bash
        run: |
          cat morrow-ci/part_* > /tmp/morrow-source.b64
          base64 -d /tmp/morrow-source.b64 > /tmp/morrow-source.tar.xz
          mkdir -p morrow-src
          tar -xJf /tmp/morrow-source.tar.xz -C morrow-src
          echo 'Source reconstructed:'
          find morrow-src -maxdepth 2 -type f | sort | head -50

      - name: Build Forge mod
        working-directory: morrow-src
        run: gradle --no-daemon clean build

      - name: Verify JAR
        working-directory: morrow-src
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)"
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'com/credesasq/morrow/MorrowMod.class'
          sha256sum "$JAR"
          cp "$JAR" build/libs/MORROW-Blue-Circle-0.8.0-Forge-1.20.1.jar

      - name: Upload MORROW JAR
        uses: actions/upload-artifact@v4
        with:
          name: MORROW-Blue-Circle-0.8.0-Forge-1.20.1
          path: morrow-src/build/libs/MORROW-Blue-Circle-0.8.0-Forge-1.20.1.jar
          if-no-files-found: error
          retention-days: 1
