plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Compatibility correction for the Yarn 1.16.5 Ingredient client stack accessor.
tasks.register('fixYarn1165Sources') {
    doLast {
        def file = file('src/main/java/ua/credesasq/autocraft/client/gui/ItemSelectScreen.java')
        if (file.exists()) {
            def corrected = file.getText('UTF-8').replace('getMatchingStacks()', 'getMatchingStacksClient()')
            file.write(corrected, 'UTF-8')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('fixYarn1165Sources')
    options.release = 8
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
